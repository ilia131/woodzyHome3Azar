x-app: &app
  image: homeaksoria-phase0:local
  pull_policy: never
  environment: &app-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run ./start to generate credentials}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    SITE_URL: ${SITE_URL:-http://localhost:3000}
    SEO_MEDIA_URL: ${SEO_MEDIA_URL:-}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    SECURE_COOKIES: ${SECURE_COOKIES:-0}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
    SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-0}
    SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-0}
    TRUST_PROXY_HTTPS: ${TRUST_PROXY_HTTPS:-0}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    STORE_CURRENCY: ${STORE_CURRENCY:-IRR}
    TRANSACTIONAL_EMAIL_ENABLED: ${TRANSACTIONAL_EMAIL_ENABLED:-0}
    STORE_EMAIL_HOST: ${STORE_EMAIL_HOST:-localhost}
    STORE_EMAIL_PORT: ${STORE_EMAIL_PORT:-587}
    STORE_EMAIL_USER: ${STORE_EMAIL_USER:-}
    STORE_EMAIL_PASSWORD: ${STORE_EMAIL_PASSWORD:-}
    STORE_EMAIL_TLS: ${STORE_EMAIL_TLS:-1}
    STORE_FROM_EMAIL: ${STORE_FROM_EMAIL:-webmaster@localhost}
    INVENTORY_RESERVATION_SECONDS: ${INVENTORY_RESERVATION_SECONDS:-900}
    SNAPP_PAY_ENABLED: ${SNAPP_PAY_ENABLED:-false}
    DIGIPAY_ENABLED: ${DIGIPAY_ENABLED:-false}
    TOROB_PAY_ENABLED: ${TOROB_PAY_ENABLED:-false}
    PAYMENT_MODE: ${PAYMENT_MODE:-production}
    PAYMENT_DEFAULT_PROVIDER: ${PAYMENT_DEFAULT_PROVIDER:-mock}
    PAYMENT_INITIATION_TIMEOUT: ${PAYMENT_INITIATION_TIMEOUT:-15}
    PAYMENT_VERIFICATION_TIMEOUT: ${PAYMENT_VERIFICATION_TIMEOUT:-15}
    PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-false}
    PAYMENT_MOCK_SIGNING_KEY: ${PAYMENT_MOCK_SIGNING_KEY:-}
    PAYMENT_PENDING_EXPIRATION_SECONDS: ${PAYMENT_PENDING_EXPIRATION_SECONDS:-900}
    POSTGRES_DB: ${POSTGRES_DB:-aksoria}
    POSTGRES_HOST: db
    POSTGRES_USER: aksoria_runtime
    POSTGRES_PASSWORD: ${AKSORIA_RUNTIME_PASSWORD:?Run ./start to generate credentials}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    TRUSTED_PROXY_COUNT: "1"
  volumes:
    - media:/app/media
    - static:/app/staticfiles

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aksoria}
      POSTGRES_USER: ${POSTGRES_USER:-aksoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./start to generate credentials}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  init:
    <<: *app
    profiles: [deploy]
    environment:
      <<: *app-env
      POSTGRES_USER: aksoria_migration
      POSTGRES_PASSWORD: ${AKSORIA_MIGRATION_PASSWORD:?Run ./start to generate credentials}
    command:
      - sh
      - -ec
      - |
        python manage.py migrate --noinput
        python manage.py provision_roles
        python manage.py collectstatic --noinput
        python manage.py shell -c "from django.db import connection; connection.cursor().execute('REVOKE INSERT, UPDATE, DELETE ON django_migrations FROM aksoria_runtime')"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    <<: *app
    build: .
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; from config.wsgi import application; from django.db import connection; socket.create_connection(('127.0.0.1', 8000), 2).close(); connection.cursor().execute('SELECT 1')"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    image: nginx:alpine
    depends_on:
      web: {condition: service_healthy}
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8000}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/media:ro
      - static:/staticfiles:ro

  worker:
    <<: *app
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    <<: *app
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=INFO", "--schedule=/app/runtime/celerybeat"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres:
  media:
  static:
